<!doctype html>
<html lang="zh-CN" class="md3">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>小满</title>
<script>
  /* 主题尽早生效：本地偏好 > 系统。提前打 data-theme，刷新不闪一下。 */
  (function () {
    try {
      var m = localStorage.getItem('xm_theme') || 'system';
      if (m !== 'light' && m !== 'dark') m = 'system';
      var dark = m === 'dark' || (m === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      var r = document.documentElement;
      if (m === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', m);
      r.style.colorScheme = dark ? 'dark' : 'light';
    } catch (e) { /* 无痕模式里 localStorage 会抛，忽略 */ }
  })();
  /* 界面缩放尽早生效：平板默认 90%，手机默认 100%；用户可在设置里改。 */
  (function () {
    try {
      var z = parseFloat(localStorage.getItem('xm_ui_scale'));
      if (!(z >= 0.8 && z <= 1.15)) z = window.innerWidth >= 900 ? 0.9 : 1;
      if (Math.abs(z - 1) > 0.001) {
        document.documentElement.style.setProperty('--ui-scale', z);
        document.documentElement.classList.add('ui-scaled');
      }
    } catch (e) { /* ignore */ }
  })();
</script>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="theme-md3.css?v=md3r">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
</head>
<body>
<div id="sprite-host" hidden></div>

<div class="shell" id="shell">
  <nav class="rail" aria-label="主导航">
    <img class="logo" src="logo.svg" alt="小满">
    <button type="button" class="it on" id="rail-chat" data-act="rail-chat" aria-current="page">
      <svg class="ic" aria-hidden="true"><use data-i="circle-dot"/></svg><span>对话</span>
    </button>
    <button type="button" class="it" id="rail-bank" data-act="rail-bank">
      <svg class="ic" aria-hidden="true"><use data-i="book-open-text"/></svg><span>题库</span>
    </button>
    <button type="button" class="it" id="rail-library" data-act="rail-library">
      <svg class="ic" aria-hidden="true"><use data-i="book"/></svg><span>资料</span>
    </button>
    <button type="button" class="it" id="rail-map" data-act="rail-map">
      <svg class="ic" aria-hidden="true"><use data-i="map"/></svg><span>地图</span>
    </button>
    <button type="button" class="it" id="rail-memories" data-act="rail-memories">
      <svg class="ic" aria-hidden="true"><use data-i="clock"/></svg><span>记忆</span>
    </button>
    <button type="button" class="it" id="rail-week" data-act="rail-week">
      <svg class="ic" aria-hidden="true"><use data-i="zap"/></svg><span>本周</span>
    </button>
    <div class="sp"></div>
    <button type="button" class="it" id="rail-settings" data-act="rail-settings">
      <svg class="ic" aria-hidden="true"><use data-i="settings"/></svg><span>设置</span>
    </button>
  </nav>

  <nav class="spaces" id="spaces" aria-label="学习空间"></nav>

  <aside class="qpanel" id="qpanel" hidden aria-label="题目面板"></aside>

  <aside class="convside" id="convside" aria-label="对话列表"></aside>

  <main class="pane" id="pane">
    <section class="view" id="view-chat">
      <header class="top">
        <button type="button" class="hit back topback" id="top-back" hidden data-act="toggle-side" aria-label="对话列表"><svg class="ic" aria-hidden="true"><use data-i="chevron-left"/></svg></button>
        <button type="button" class="hit side-toggle" id="top-side" hidden data-act="toggle-convside" aria-label="收起对话列表"><span class="ic msym" aria-hidden="true">left_panel_close</span></button>
        <div class="l1" id="top-brand">小满</div>
        <div class="l2">
          <button type="button" class="subj" id="top-subj" data-act="open-subjects" aria-haspopup="dialog">
            <svg class="ic" id="top-subj-icon" aria-hidden="true"><use href="#i-circle-dot"/></svg>
            <span id="top-subject">全部</span>
            <svg class="ic car" aria-hidden="true"><use data-i="chevron-down"/></svg>
          </button>
          <div class="sp"></div>
        </div>
      </header>

      <div class="stream" id="stream" aria-live="polite" aria-busy="true">
        <div class="col">
          <div class="skel">
            <div class="row w60"></div>
            <div class="row w80"></div>
            <div class="row w40"></div>
          </div>
        </div>
      </div>

      <button type="button" class="tobottom" id="to-bottom" data-act="to-bottom" aria-label="回到底部" hidden>
        <svg class="ic" aria-hidden="true"><use data-i="chevron-down"/></svg>
      </button>

      <form class="composer" id="composer" autocomplete="off">
        <div class="col">
          <div class="cbox" id="cbox">
            <div class="skillchips" id="skillchips" hidden></div>
            <div class="qchips" id="qchips" hidden></div>
            <div class="thumbs" id="thumbs" hidden></div>
            <div class="tools">
              <button type="button" class="mpill hit44" id="model-pill" data-act="open-sheet" aria-haspopup="dialog">
                <span class="pv" id="pill-provider">加载中</span>
                <span class="md2" id="pill-model">—</span>
                <svg class="ic sm car" aria-hidden="true"><use data-i="chevron-down"/></svg>
              </button>
              <button type="button" class="mpill skillpill hit44" id="skill-pill" data-act="open-skill-sheet" aria-haspopup="dialog">
                <svg class="ic sm" aria-hidden="true"><use data-i="sparkles"/></svg>
                <span class="pv" id="pill-skill">技能</span>
                <svg class="ic sm car" aria-hidden="true"><use data-i="chevron-down"/></svg>
              </button>
              <div class="sp"></div>
              <div class="think" role="group" aria-label="思考档位">
                <button type="button" class="tpill hit44" data-act="set-think" data-think="off" aria-pressed="false">关</button>
                <button type="button" class="tpill hit44" data-act="set-think" data-think="med" aria-pressed="false">
                  <svg class="ic sm" aria-hidden="true"><use data-i="zap"/></svg><span>中</span>
                </button>
                <button type="button" class="tpill hit44" data-act="set-think" data-think="high" aria-pressed="false">
                  <svg class="ic sm" aria-hidden="true"><use data-i="zap"/></svg><span>高</span>
                </button>
              </div>
            </div>
            <div class="crow">
              <button type="button" class="ib" id="btn-attach" aria-label="添加">
                <svg class="ic" aria-hidden="true"><use data-i="plus"/></svg>
              </button>
              <textarea class="ta" id="ta" rows="1" placeholder="说点什么…" aria-label="输入内容"></textarea>
              <button type="submit" class="send" id="btn-send" aria-label="发送" disabled>
                <svg class="ic sm" aria-hidden="true"><use data-i="arrow-up"/></svg>
              </button>
            </div>
            <input type="file" id="file-attach" accept="image/*" multiple hidden>
          </div>
        </div>
      </form>
    </section>

    <section class="view" id="view-page" hidden></section>
  </main>

  <aside class="previewpane" id="previewpane" hidden aria-label="资料预览"></aside>

  <div class="overlay" id="overlay" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<section class="ob" id="onboarding" hidden aria-labelledby="ob-title">
  <div class="ob-card">
    <div class="ob-brand"><img src="logo.svg" alt=""><span>小满 · 第一次见</span></div>
    <div class="ob-kicker">先互相认识一下</div>
    <h1 class="ob-title" id="ob-title">她叫什么，你叫什么？</h1>
    <p class="ob-sub">之后都可以在设置里改。</p>

    <label class="ob-field">
      <span>她的名字</span>
      <input id="ob-agent" maxlength="12" value="小满" autocomplete="off">
    </label>
    <label class="ob-field">
      <span>你的名字</span>
      <input id="ob-user" maxlength="20" placeholder="比如：小陈" autocomplete="off">
    </label>
    <div class="ob-field">
      <span>性别</span>
      <div class="ob-seg" role="group" aria-label="性别">
        <button type="button" data-gender="female">女生</button>
        <button type="button" data-gender="male">男生</button>
        <button type="button" data-gender="other" class="on">不填</button>
      </div>
    </div>
    <label class="ob-field">
      <span>年级</span>
      <select id="ob-grade">
        <option>高一</option><option>高二</option><option>高三</option>
      </select>
    </label>

    <button type="button" class="ob-go" id="ob-go">开始对话</button>
    <p class="ob-fine">资料只保存在你的服务器和这台设备上。</p>
  </div>
</section>

<section class="ob auth" id="auth" hidden aria-labelledby="auth-title">
  <div class="ob-card">
    <div class="ob-brand"><img src="logo.svg" alt=""><span>小满 · 私人空间</span></div>
    <div class="ob-kicker">需要访问密码</div>
    <h1 class="ob-title" id="auth-title">进入小满</h1>
    <p class="ob-sub">这个密码在服务器上设置，登录后只在本机保存会话。</p>
    <label class="ob-field">
      <span>访问密码</span>
      <input id="auth-pass" type="password" maxlength="128" placeholder="输入访问密码" autocomplete="current-password">
    </label>
    <p class="auth-error" id="auth-error" hidden></p>
    <button type="button" class="ob-go" id="auth-go">进入</button>
    <p class="ob-fine">密码只发送到你的服务器；登录后 30 天内不用再输。</p>
  </div>
</section>

<noscript>小满需要 JavaScript。</noscript>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<script src="vendor/cytoscape/cytoscape.min.js"></script>
<script src="app.js?v=md3r"></script>
</body>
</html>
