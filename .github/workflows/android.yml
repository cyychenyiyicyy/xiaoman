name: Android alpha

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build alpha APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 默认会装已下架的 "tools"；这里只装 cmdline-tools，平台包下一步显式装。
          packages: ''

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        env:
          XIAOMAN_SERVER_URL: ${{ vars.XIAOMAN_SERVER_URL }}
        run: |
          SERVER_URL="${XIAOMAN_SERVER_URL:-http://127.0.0.1:8787}"
          gradle assembleDebug --no-daemon -PserverUrl="$SERVER_URL"

      - name: Name alpha APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/xiaoman-alpha-0.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoman-alpha-0.1
          path: android/app/build/outputs/apk/debug/xiaoman-alpha-0.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 小满 alpha 0.1
          tag_name: ${{ github.ref_name }}
          prerelease: true
          files: android/app/build/outputs/apk/debug/xiaoman-alpha-0.1.apk
          fail_on_unmatched_files: true
          body: |
            WebView 壳，加载自建服务器（地址由构建变量 XIAOMAN_SERVER_URL 注入）。不是离线应用；服务器不可达时会显示离线页。

            - 包名 site.e1e.xiaoman
            - 平板 / 手机自适应，横竖屏与分屏
            - 拍题调用前摄，也可从相册选择
            - debug 签名，自用测试
