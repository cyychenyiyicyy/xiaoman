plugins {
    id "com.android.application"
}

android {
    namespace "site.e1e.xiaoman"
    compileSdk 34

    defaultConfig {
        applicationId "site.e1e.xiaoman"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "0.3.0-alpha"
    }

    buildFeatures {
        buildConfig true
    }

    // 固定 debug 签名：GitHub Actions 每次 runner 都换默认 debug key，
    // 会导致新 APK 无法覆盖安装。这个 key 只用于 alpha 自用，不是发布密钥。
    signingConfigs {
        debug {
            storeFile file("../keystore/xiaoman-debug.jks")
            storePassword "xiaoman-debug-2026"
            keyAlias "xiaoman"
            keyPassword "xiaoman-debug-2026"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding "UTF-8"
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.webkit:webkit:1.11.0"

    // 拍题用自建相机页。CameraX 1.4.x 是 compileSdk 34 上最新的稳定线。
    implementation "androidx.camera:camera-core:1.4.2"
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    implementation "androidx.camera:camera-view:1.4.2"

    // CameraX.bindToLifecycle 要 LifecycleOwner，裸 Activity 不是。
    // 只补 lifecycle-runtime 自建 LifecycleRegistry，不引 AppCompat / Compose / Material。
    implementation "androidx.lifecycle:lifecycle-runtime:2.6.2"
}
